name: Refrain
packages:
  Alamofire:
    path: Vendor/Alamofire
options:
  bundleIdPrefix: com.refrain
  deploymentTarget:
    iOS: "17.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Refrain:
    type: application
    platform: iOS
    sources:
      - path: Refrain
    dependencies:
      - target: RefrainWatch
        embed: true
      - package: Alamofire
    resources:
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refrain.triptych
        PRODUCT_NAME: Refrain
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Chickefrain
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  RefrainWatch:
    type: application
    platform: watchOS
    sources:
      - path: Refrain/ReviewLaunch.swift
      - path: Refrain/DesignTokens.swift
      - path: RefrainWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refrain.triptych.watchkitapp
        PRODUCT_NAME: RefrainWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chickefrain
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.refrain.triptych
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  RefrainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RefrainTests
    dependencies:
      - target: Refrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refrain.triptych.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Refrain.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Refrain"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Refrain:
    build:
      targets:
        Refrain: all
        RefrainTests: [test]
    test:
      targets:
        - RefrainTests
  RefrainWatch:
    build:
      targets:
        RefrainWatch: all
